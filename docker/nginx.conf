worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  server_tokens off;
  client_max_body_size 20m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen       8080;
    server_name  _;

    # 스크롤 인트로 (원페이지 진입점)
    location = / {
      root /app/web/intro;
      try_files /index.html =404;
    }

    location /intro/ {
      alias /app/web/intro/;
      try_files $uri $uri/ /intro/index.html;
    }

    location /assets/ {
      alias /app/assets/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      proxy_pass http://127.0.0.1:8000/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Streamlit 게임 UI
    # 새로고침(F5) 시 인트로(/)로 복귀 — HTML에 스크립트 삽입 (components iframe 우회)
    location /game/ {
      proxy_pass http://127.0.0.1:8501/game/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Accept-Encoding "";
      proxy_read_timeout 86400;
      proxy_hide_header X-Frame-Options;
      add_header Content-Security-Policy "frame-ancestors *" always;
      sub_filter_types text/html;
      sub_filter_once on;
      # F5/새로고침이면 / 인트로로. 인트로「입장하기」는 intro_done 또는 sessionStorage로 통과.
      sub_filter '</head>' '<script>(function(){try{var path=location.pathname||"";if(path.indexOf("/game")!==0)return;var q=new URLSearchParams(location.search||"");var fromIntro=q.get("intro_done")==="1";try{if(sessionStorage.getItem("truth_room_enter")==="1"){fromIntro=true;sessionStorage.removeItem("truth_room_enter");}}catch(e){}if(fromIntro)return;var n=(performance.getEntriesByType&&performance.getEntriesByType("navigation")[0])||null;var reload=!!(n&&n.type==="reload");if(!reload&&performance.navigation)reload=performance.navigation.type===1;if(reload)location.replace("/");}catch(e){}})();</script></head>';
    }
  }
}
