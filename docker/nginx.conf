worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  server_tokens off;
  client_max_body_size 20m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen       8080;
    server_name  _;

    # 스크롤 인트로 (원페이지 진입점)
    location = / {
      root /app/web/intro;
      try_files /index.html =404;
    }

    location /intro/ {
      alias /app/web/intro/;
      try_files $uri $uri/ /intro/index.html;
    }

    location /assets/ {
      alias /app/assets/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      proxy_pass http://127.0.0.1:8000/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # React 게임 UI (Vite base=/game/)
    location = /game {
      return 302 /game/;
    }

    location /game/ {
      alias /app/web/game/dist/;
      index index.html;
      try_files $uri $uri/ @game_spa;
      add_header Cache-Control "no-cache";
    }

    location @game_spa {
      rewrite ^ /game/index.html last;
    }

    location = /game/index.html {
      alias /app/web/game/dist/index.html;
      add_header Cache-Control "no-cache";
      sub_filter_types text/html;
      sub_filter_once on;
      sub_filter '</head>' '<script>(function(){try{var path=location.pathname||"";if(path.indexOf("/game")!==0)return;if(!window.__truthRoomRefreshGuard){window.__truthRoomRefreshGuard=true;window.addEventListener("keydown",function(e){try{var key=String(e.key||"");var refresh=key==="F5"||((e.metaKey||e.ctrlKey)&&key.toLowerCase()==="r");if(!refresh)return;e.preventDefault();e.stopImmediatePropagation();location.replace("/");}catch(err){try{location.reload();}catch(e2){}}},true);}var q=new URLSearchParams(location.search||"");var fromIntro=q.get("intro_done")==="1";try{if(sessionStorage.getItem("truth_room_enter")==="1"){fromIntro=true;sessionStorage.removeItem("truth_room_enter");}}catch(e){}if(fromIntro)return;var n=(performance.getEntriesByType&&performance.getEntriesByType("navigation")[0])||null;var reload=!!(n&&n.type==="reload");if(!reload&&performance.navigation)reload=performance.navigation.type===1;if(reload)location.replace("/");}catch(e){}})();</script></head>';
    }

    # 로컬 백업: Streamlit (선택)
    location /game-streamlit/ {
      proxy_pass http://127.0.0.1:8501/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400;
    }
  }
}
