# rag.yaml
# cp configs/rag.yaml.example configs/rag.yaml

embedding_model: local_hashing_ngram
index_backend: local  # local | chroma (실험 시 chroma + build_index --backend chroma)
persist_dir: runs/rag/index
collection: truth_room
local_dense_dim: 256

# 선택 실험 — OpenAI embedding + Chroma
openai_embedding:
  model: text-embedding-3-small
  persist_dir: runs/rag/chroma
  batch_size: 64

retrieval:
  top_k: 5
  rrf_k: 60
  rerank: true
  expand_query: true
  boost_evidence: 0.20
  boost_canonical: 0.25
  boost_keyword: 0.05
  # 비우면 전체 소스. 예: [messenger, corporate_card]
  source_types: []
  modes:
    baseline: dense
    advanced: hybrid_rrf   # dense + sparse RRF + rerank + query expand
    embedding: openai_chroma

generation:
  model: gpt-4o-mini
  temperature: 0.2
