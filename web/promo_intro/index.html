<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>진실의 방 — Promo Intro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a1d26;
      --ink: #f7f3eb;
      --muted: #d2c9bb;
      --accent: #e8c58f;
      --panel: rgba(14, 16, 22, 0.88);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0e1016;
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* 1920×1080 — 녹화 후 다운스케일해도 글자·기기 선명 */
    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      margin: 0 auto;
      background: #161922;
      overflow: hidden;
    }
    .scene {
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity 0.7s ease;
      z-index: 1;
    }
    .scene.is-on { opacity: 1; z-index: 2; }

    .scene img.bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      /* filter 최소화 — 뭉개짐·밴딩 주범 */
      filter: brightness(1.18) contrast(1.04);
      image-rendering: auto;
    }
    /* 하단만 가림: 본문 이미지와 카피가 겹치지 않게 */
    .band {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 280px;
      background: linear-gradient(180deg, transparent 0%, rgba(10,12,16,0.55) 28%, rgba(10,12,16,0.94) 100%);
      z-index: 3;
    }
    .copy {
      position: absolute;
      left: 96px; right: 96px; bottom: 88px;
      z-index: 5;
      max-width: 920px;
    }
    .copy.center {
      left: 50%; right: auto;
      transform: translateX(-50%);
      text-align: center;
      max-width: 960px;
      bottom: auto;
      top: 50%;
      translate: 0 -50%;
    }
    .kicker {
      font-size: 15px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 18px;
    }
    .title {
      font-family: "Cormorant Garamond", "Noto Sans KR", serif;
      font-size: 72px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
    }
    .title em { font-style: italic; color: #fff8ee; }
    .sub {
      font-size: 22px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.55;
    }

    /* Scene 3: 단색 배경 + 큰 기기 프레임 (사진 위 사진 금지) */
    .scene-devices {
      background: radial-gradient(900px 520px at 50% 35%, #2b3140 0%, #171b24 70%, #12151c 100%);
    }
    .devices {
      position: absolute;
      left: 50%; top: 44%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: flex-end;
      gap: 48px;
      z-index: 4;
    }
    .device {
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .scene.is-on .device { opacity: 1; transform: translateY(0); }
    .scene.is-on .device:nth-child(1) { transition-delay: 0.1s; }
    .scene.is-on .device:nth-child(2) { transition-delay: 0.28s; }
    .scene.is-on .device:nth-child(3) { transition-delay: 0.46s; }
    .frame {
      border: 2px solid rgba(247,243,235,0.35);
      background: #0c0e12;
      box-shadow: 0 28px 60px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    .frame.laptop { width: 720px; height: 430px; border-radius: 12px; }
    .frame.tablet { width: 300px; height: 400px; border-radius: 20px; }
    .frame.phone { width: 180px; height: 360px; border-radius: 28px; }
    .frame img {
      width: 100%; height: 100%;
      display: block;
      /* 기기 화면만 크롭 — 작은 UI 전체가 한 프레임에 쑤셔지지 않게 */
      object-fit: cover;
      filter: brightness(1.25) contrast(1.06);
    }
    .frame.laptop img { object-position: 38% 42%; }
    .frame.tablet img { object-position: 18% 45%; }
    .frame.phone img { object-position: 78% 40%; }
    .label {
      margin-top: 18px;
      font-size: 14px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }
    .caption {
      position: absolute;
      left: 0; right: 0; bottom: 56px;
      text-align: center;
      z-index: 5;
      font-size: 20px;
      color: var(--muted);
    }

    /* Scene 4: 플랫 CTA — 배경 목업과 글자 겹침 제거 */
    .scene-end {
      background: #151922;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cta {
      text-align: center;
      padding: 64px 80px;
      border: 1px solid rgba(247,243,235,0.28);
      background: #1c2230;
      border-radius: 4px;
      min-width: 780px;
    }
    .cta .title { font-size: 56px; margin-bottom: 20px; }
    .cta .url {
      font-size: 28px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.02em;
      margin-top: 8px;
    }
    .cta .hint {
      margin-top: 28px;
      font-size: 16px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .progress {
      position: absolute;
      left: 96px; right: 96px; bottom: 28px;
      height: 2px;
      background: rgba(247,243,235,0.12);
      z-index: 21;
    }
    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="progress"><i id="bar"></i></div>

    <!-- 1. Title — 카피는 하단 밴드만 -->
    <section class="scene" data-ms="3400">
      <img class="bg" src="media/case_mood.webp" alt="" onerror="this.src='media/devices_hero.png'" />
      <div class="band"></div>
      <div class="copy">
        <p class="kicker">Interactive Mystery · Demo</p>
        <h1 class="title">방구석 프로파일러<br /><em>진실의 방으로</em></h1>
        <p class="sub">심문 · 증거 · 지목 — 어디서든 같은 사건으로.</p>
      </div>
    </section>

    <!-- 2. Multi-device still — 이미지 풀샷, 텍스트는 하단만 (화면 위 큰 글자 X) -->
    <section class="scene" data-ms="4000">
      <img class="bg" src="media/devices_hero.png" alt="" style="filter: brightness(1.28) contrast(1.05);" />
      <div class="band" style="height: 200px;"></div>
      <div class="copy" style="bottom: 72px; max-width: 100%;">
        <p class="kicker">Cross Device</p>
        <p class="sub" style="font-size: 24px; color: #f0e9dc;">Desktop · Tablet · Mobile — 하나의 수사, 여러 화면</p>
      </div>
    </section>

    <!-- 3. Full device still — 프레임 안에 또 목업 넣지 않음(이중 축소 = 뭉개짐) -->
    <section class="scene" data-ms="4400">
      <img class="bg" src="media/devices_trio.png" alt="" style="filter: brightness(1.32) contrast(1.06);" />
      <div class="band" style="height: 180px;"></div>
      <div class="copy" style="bottom: 64px; max-width: 100%;">
        <p class="kicker">Desktop · Tablet · Mobile</p>
        <p class="sub" style="font-size: 24px; color: #f0e9dc;">발표 · 플레이 · 리허설 — 기기 장벽 없이</p>
      </div>
    </section>

    <!-- 4. Clean CTA card -->
    <section class="scene scene-end" data-ms="3000">
      <div class="cta">
        <p class="kicker">Live</p>
        <h1 class="title">지금 바로 입장</h1>
        <p class="url">web-production-072b8.up.railway.app</p>
        <p class="hint">방구석 프로파일러 · 진실의 방으로</p>
      </div>
    </section>
  </div>

  <script>
    const scenes = [...document.querySelectorAll(".scene")];
    const bar = document.getElementById("bar");
    const total = scenes.reduce((s, el) => s + Number(el.dataset.ms || 3000), 0);
    let elapsed = 0;

    function show(idx) {
      scenes.forEach((el, n) => el.classList.toggle("is-on", n === idx));
    }

    async function run() {
      for (let n = 0; n < scenes.length; n++) {
        show(n);
        const ms = Number(scenes[n].dataset.ms || 3000);
        const step = 50;
        for (let t = 0; t < ms; t += step) {
          elapsed += step;
          bar.style.width = Math.min(100, (elapsed / total) * 100) + "%";
          await new Promise((r) => setTimeout(r, step));
        }
      }
      document.documentElement.setAttribute("data-done", "1");
    }
    run();
  </script>
</body>
</html>
