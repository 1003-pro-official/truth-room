<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진실의 방 — 수사 브리핑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/intro/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">진실의 방</div>
    <div class="topbar-right">
      <button type="button" class="bgm-toggle" id="bgmToggle" aria-pressed="false" aria-label="배경음악" title="배경음악">
        <span class="eq" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </span>
      </button>
      <p class="topbar-hint" id="scrollHint">잠시 후 자동 진행 · 스크롤로도 이동</p>
    </div>
  </header>

  <audio
    id="introBgm"
    src="/assets/audio/intro.mp3"
    loop
    preload="auto"
    autoplay
    playsinline
  ></audio>
  <audio
    id="gameBgm"
    src="/assets/audio/game.mp3"
    loop
    preload="auto"
    playsinline
  ></audio>

  <main id="pinRoot" class="pin-root" aria-live="polite">
    <!-- scenes injected by app.js -->
  </main>

  <script src="/intro/app.js"></script>
</body>
</html>
