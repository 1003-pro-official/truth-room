# data/sft/auto_ask_questions.yaml — 자동 심문 질문셋 (말투 FT 수집용)
# 알리바이·증거 압박은 시나리오에 맞되, 정답(culprit) 단정 문구는 넣지 않는다.
# variants: true 이면 스크립트가 조사·어미를 가볍게 변형한다.

version: 1
variants: true

# 공통 질문 (세 용의자 순환)
shared:
  - 그날 밤 어디에 있었습니까?
  - 23시에서 24시 사이에 뭘 하고 있었죠?
  - 알리바이를 다시 말해 주세요.
  - 같이 야근한 사람 중에 수상한 사람 있었나요?
  - 서버실 쪽에 가본 적 있습니까?
  - 그 시간대에 자리를 비운 적 있나요?
  - 증거가 나오면 어떻게 설명하실 겁니까?
  - 긴장하신 것 같은데, 숨기는 거 있습니까?
  - 동료 이야기에 모순이 보이는데 어떻게 생각하세요?
  - 그날 비 오는 날이었죠. 기억나는 거 더 없습니까?

# 용의자별 특화 (페르소나·공개 알리바이 압박)
by_suspect:
  suspect_a:  # 김팀장
    - 법인카드로 강남 쪽 결제한 기록이 있던데요?
    - 자리에서 기획안만 보고 있었다고요?
    - 팀장으로서 부하 직원 동선은 파악하고 계셨습니까?
    - 룸살롱 결제 건, 본인 카드 맞습니까?
    - 그때 집에 있었다고 하셨는데 맞나요?
    - 서버실 지문 로그에 대해 어떻게 생각하세요?
    - 이대리나 박신입 중에 의한 사람 있습니까?
    - 야근 지시를 누가 내렸는지 말해 주세요.
  suspect_b:  # 이대리
    - 라운지에서 노트북만 보고 있었다고요?
    - Wi-Fi로 대용량 전송한 기록, 본인 기기 맞습니까?
    - 헤드폰 끼고 오래 앉아 있던 CCTV 분위기가 있던데요.
    - 김팀장 지문 로그를 어떻게 보십니까?
    - 박신입이 서버실에 갔다는 이야기, 들으셨나요?
    - 개인 노트북 MAC이 찍힌 이유를 설명해 주세요.
    - 그날 외부로 보낸 파일 있습니까?
    - 알리바이가 흔들리면 어떻게 하시겠습니까?
  suspect_c:  # 박신입
    - 화장실에만 있었다고 하셨죠?
    - 슬랙에 서버실 관련 메시지를 보낸 적 있습니까?
    - 몰래 서버실에 들어갔다는 뉘앙스의 대화, 기억나세요?
    - 김팀장이 자리를 비운 걸 보셨나요?
    - 이대리가 라운지에 있던 거 아셨습니까?
    - 신입이라 눈치를 본 건 아닌가요?
    - 그날 DM으로 누구에게 뭐라고 했습니까?
    - 목격한 게 있으면 지금 말하는 게 좋습니다.

# 날짜별 프리셋 (8/4~8/7) — turns = 그날 목표 ask 수
schedule:
  "2026-08-04":
    label: day1_alibi
    turns: 45
    focus: [shared, suspect_a, suspect_b, suspect_c]
  "2026-08-05":
    label: day2_evidence
    turns: 45
    focus: [suspect_a, suspect_b, suspect_c, shared]
  "2026-08-06":
    label: day3_pressure
    turns: 45
    focus: [suspect_b, suspect_c, suspect_a, shared]
  "2026-08-07":
    label: day4_fill
    turns: 30
    focus: [shared, suspect_a, suspect_b, suspect_c]
