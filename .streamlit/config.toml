[theme]
base = "dark"
primaryColor = "#7A9BB8"
backgroundColor = "#151820"
secondaryBackgroundColor = "#1a1e26"
textColor = "#d5d8de"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
# File change / Rerun / Deploy 등 개발자 툴바 최소화
toolbarMode = "minimal"

[server]
headless = true
# Cloudflare Container / reverse proxy (WebSocket)
enableCORS = false
enableXsrfProtection = false
